<html>
    <head>
    <title>Generative AI Literacy Quiz</title>
<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f8f6;
    color: #24352f;
    font-size: 16px;
}
   caption {
    font-size: 26px;
    font-weight: bold;
    color: #2b6959;
    padding: 20px;
    border-bottom: 4px solid #edb731;
}

textarea {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid #2b6959;
    border-radius: 6px;
    background-color: #ffffff;
    box-sizing: border-box;
}
/* Add spacing and a gold divider above feedback */
textarea[name="thequestion"] {
    margin-top: 20px;
    margin-bottom: 20px;
}

textarea[name="thesolution"] {
    margin-top: 10px;
}

td:has(textarea[name="thesolution"]) {
    border-top: 4px solid #edb731;
    padding-top: 20px;
}
/* Style the quiz navigation buttons */
input[type="button"] {
    background-color: #2b6959;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

input[type="button"]:hover {
    background-color: #0f8165;
}

/* Style the answer dropdown */
select[name="theresponse"] {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    padding: 8px;
    border: 1px solid #2b6959;
    border-radius: 6px;
    background-color: white;
}
/* Style the Start Over link */
a {
    color: #2b6959;
    font-size: 15px;
    font-weight: bold;
}

a:hover {
    color: #0f8165;
}

/* Add spacing around the navigation area */
select[name="theresponse"] {
    margin-bottom: 12px;
}
/* Make feedback heading more prominent */
td:has(textarea[name="thesolution"]) strong {
    font-size: 20px;
    color: #2b6959;
}

/* Keep the feedback explanation slightly smaller */
textarea[name="thesolution"] {
    font-size: 17px;
</style>
</head>

    <body>
    <div align="left">

<table border="0" cellspacing="0" cellpadding="0" width="100%">
  <tr>
    <td width="50%"><form method="POST" name="instantquiz">
      <table border="0" width="100%" cellspacing="0" cellpadding="0">
        <caption><strong>Generative AI Literacy Quiz</strong></caption>
        <tr>
          <td width="100%"><div align="center"><center><p><textarea rows="13" name="thequestion"
          cols="95" wrap="virtual"></textarea></td>
        </tr>
        <tr align="center">
         <td width="100%">
    <p><strong>Answer Feedback</strong></p>
    <textarea name="thesolution" rows="4" cols="95" readonly></textarea>
</td>
        </tr>
        <tr align="center">
          <td width="100%"><div align="center"><center><p><strong>Your response:</strong> <select
          name="theresponse" size="1" onChange="responses()">
            <option value="-----">----</option>
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
          </select> <input type="button" value="&lt;&lt;Back" name="B1"
          onClick="if (whichone&gt;1){whichone--;generatequestions()}"> <input type="button"
          value="Next&gt;&gt;" name="B2"
          onClick="if (whichone&lt;=total){whichone++;generatequestions()}"><br>
          <small><a href="#" onClick="whichone=1;generatequestions();return false">Start Over</a> </small>
          <p align="center"><font face="arial" size="-2">This free quiz script provided by</font><br> <font face="arial, helvetica" size="-2"><a href="http://javascriptkit.com">JavaScript Kit</a></font></p></td>
        </tr>
      </table>
    </form>
    </td>
  </tr>
</table>
</div>
<script src="pop.js"></script>

<script language="JavaScript1.1">
var whichone=1
var tempmn=document.instantquiz.thequestion
function generatequestions(){
document.instantquiz.theresponse.selectedIndex=0
document.instantquiz.thesolution.value=''
if (whichone>=total+1)
tempmn.value="You've completed the Generative AI Literacy Quiz!\n\nUnderstanding how generative AI works, recognizing its limitations, and using it responsibly are important AI literacy skills.\n\nRemember to verify AI-generated information, protect personal information, and follow your instructor's guidelines for AI use."
else{
tempmn.value=whichone+")"+question[whichone]+"\n\n"+"a)"+eval('choice'+whichone+'[1]')+"\n"+"b)"+eval('choice'+whichone+'[2]')+"\n"+"c)"+eval('choice'+whichone+'[3]')+"\n"+"d)"+eval('choice'+whichone+'[4]')

}
}

function responses(){
var temp2=document.instantquiz.theresponse
var temp3=temp2.options[temp2.selectedIndex].text

if (temp2.selectedIndex==0){
document.instantquiz.thesolution.value=""
}
else if (temp3==solution[whichone]){
document.instantquiz.thesolution.value="Correct! "+feedback[whichone]
}
else {
document.instantquiz.thesolution.value="Incorrect. The correct answer is "+solution[whichone]+". "+feedback[whichone]
}
}

generatequestions()
</script>


    </body>

</html>
